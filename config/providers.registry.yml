version: 1
providers:
  worldbank:
    domain: governance|finance|education
    type: http
    auth: none
    endpoints:
      governance_effectiveness:
        url: "https://api.worldbank.org/v2/country/{iso3}/indicator/GE.EST?format=json&per_page=2000"
        method: GET
        path_map:
          data: "$[1]"
        cache_ttl_sec: 86400
      gdp_current_usd:
        url: "https://api.worldbank.org/v2/country/{iso3}/indicator/NY.GDP.MKTP.CD?format=json&per_page=2000"
        method: GET
        path_map:
          data: "$[1]"
        cache_ttl_sec: 86400
      gdp_per_capita:
        url: "https://api.worldbank.org/v2/country/{iso3}/indicator/NY.GDP.PCAP.CD?format=json&per_page=2000"
        method: GET
        path_map:
          data: "$[1]"
        cache_ttl_sec: 86400
      secondary_enrolment:
        url: "https://api.worldbank.org/v2/country/{iso3}/indicator/SE.SEC.ENRR?format=json&per_page=2000"
        method: GET
        path_map:
          data: "$[1]"
        cache_ttl_sec: 86400
      population_total:
        url: "https://api.worldbank.org/v2/country/{iso3}/indicator/SP.POP.TOTL?format=json&per_page=2000"
        method: GET
        path_map:
          data: "$[1]"
        cache_ttl_sec: 86400
  
  who_gho:
    domain: health
    type: http
    auth: none
    endpoints:
      life_expectancy:
        url: "https://ghoapi.azureedge.net/api/WHOSIS_000001?$filter=SpatialDim eq '{iso3}'"
        method: GET
        path_map:
          data: "$.value"
        cache_ttl_sec: 86400
  
  faostat:
    domain: food
    type: http
    auth: none
    endpoints:
      crop_production:
        url: "https://fenixservices.fao.org/faostat/api/v1/en/data/QCL?area={iso3}"
        method: GET
        path_map:
          data: "$.data"
        cache_ttl_sec: 86400
      food_supply:
        url: "https://fenixservices.fao.org/faostat/api/v1/en/data/FBS?area={iso3}"
        method: GET
        path_map:
          data: "$.data"
        cache_ttl_sec: 86400
  
  nasa_power:
    domain: climate|food
    type: http
    auth: none
    endpoints:
      daily_point:
        url: "https://power.larc.nasa.gov/api/temporal/daily/point?parameters=T2M,PRECTOT&latitude={lat}&longitude={lon}&start={start}&end={end}&format=JSON"
        method: GET
        path_map:
          data: "$.properties.parameter"
        cache_ttl_sec: 43200
  
  imf:
    domain: finance|governance
    type: http
    auth: none
    endpoints:
      weo_gdp_growth:
        url: "https://www.imf.org/external/datamapper/api/v1/NGDP_RPCH/{iso3}"
        method: GET
        path_map:
          data: "$.values"
        cache_ttl_sec: 86400
      weo_inflation:
        url: "https://www.imf.org/external/datamapper/api/v1/PCPIPCH/{iso3}"
        method: GET
        path_map:
          data: "$.values"
        cache_ttl_sec: 86400
      weo_unemployment:
        url: "https://www.imf.org/external/datamapper/api/v1/LUR/{iso3}"
        method: GET
        path_map:
          data: "$.values"
        cache_ttl_sec: 86400
      weo_fiscal_balance:
        url: "https://www.imf.org/external/datamapper/api/v1/GGXCNL_NGDP/{iso3}"
        method: GET
        path_map:
          data: "$.values"
        cache_ttl_sec: 86400
      ifs_reserves:
        url: "https://dataservices.imf.org/REST/SDMX_JSON.svc/CompactData/IFS/M.{iso3}.RAXG_USD"
        method: GET
        path_map:
          data: "$.CompactData.DataSet.Series"
        cache_ttl_sec: 86400

  un_comtrade:
    domain: trade|finance
    type: http
    auth: none
    endpoints:
      bilateral_trade:
        url: "https://comtradeapi.un.org/data/v1/get/C/A/HS?reporterCode={reporter_code}&period={year}&partnerCode=0&flowCode=M,X"
        method: GET
        path_map:
          data: "$.data"
        cache_ttl_sec: 86400
      commodity_trade:
        url: "https://comtradeapi.un.org/data/v1/get/C/A/HS?reporterCode={reporter_code}&period={year}&cmdCode={hs_code}&flowCode=M,X"
        method: GET
        path_map:
          data: "$.data"
        cache_ttl_sec: 86400

  noaa:
    domain: climate
    type: http
    auth: header
    headers:
      "token": "${NOAA_API_KEY}"
    endpoints:
      daily_summaries:
        url: "https://www.ncdc.noaa.gov/cdo-web/api/v2/data?datasetid=GHCND&locationid=FIPS:{fips}&startdate={start}&enddate={end}&limit=1000"
        method: GET
        path_map:
          data: "$.results"
        cache_ttl_sec: 43200
      severe_weather:
        url: "https://www.ncdc.noaa.gov/cdo-web/api/v2/data?datasetid=GHCND&datatypeid=TMAX,TMIN,PRCP&locationid=FIPS:{fips}&startdate={start}&enddate={end}"
        method: GET
        path_map:
          data: "$.results"
        cache_ttl_sec: 21600

  nasa_firms:
    domain: climate|food
    type: http
    auth: none
    endpoints:
      active_fires_country:
        url: "https://firms.modaps.eosdis.nasa.gov/api/country/csv/{map_key}/VIIRS_SNPP_NRT/{iso3}/1"
        method: GET
        path_map:
          data: "$"
        cache_ttl_sec: 3600
      active_fires_area:
        url: "https://firms.modaps.eosdis.nasa.gov/api/area/csv/{map_key}/VIIRS_SNPP_NRT/{west},{south},{east},{north}/1"
        method: GET
        path_map:
          data: "$"
        cache_ttl_sec: 3600

  openalex:
    domain: research|governance
    type: http
    auth: none
    endpoints:
      works_by_country:
        url: "https://api.openalex.org/works?filter=institutions.country_code:{iso2}&sort=cited_by_count:desc&per_page=50"
        method: GET
        path_map:
          data: "$.results"
        cache_ttl_sec: 86400
      institutions_by_country:
        url: "https://api.openalex.org/institutions?filter=country_code:{iso2}&sort=works_count:desc&per_page=50"
        method: GET
        path_map:
          data: "$.results"
        cache_ttl_sec: 86400
      topics_trending:
        url: "https://api.openalex.org/topics?sort=works_count:desc&per_page=50"
        method: GET
        path_map:
          data: "$.results"
        cache_ttl_sec: 86400

  worldpop:
    domain: population
    type: http
    auth: none
    endpoints:
      pop_iso3:
        url: "https://www.worldpop.org/rest/data/pop/{iso3}"
        method: GET
        path_map:
          data: "$.data"
        cache_ttl_sec: 86400
  
  osm_overpass:
    domain: urban|infrastructure
    type: http
    auth: none
    endpoints:
      overpass:
        url: "https://overpass-api.de/api/interpreter"
        method: POST
        cache_ttl_sec: 3600
  
  eia:
    domain: energy
    type: http
    auth: header
    headers:
      "X-API-Key": "${EIA_API_KEY}"
    endpoints:
      wti_daily:
        url: "https://api.eia.gov/v2/petroleum/pri/spt/data/?api_key={api_key}&frequency=daily&data[0]=value"
        method: GET
        path_map:
          data: "$.response.data"
        cache_ttl_sec: 21600
  
  gdelt:
    domain: governance|diplomacy
    type: http
    auth: none
    endpoints:
      events:
        url: "https://api.gdeltproject.org/api/v2/doc/doc?query={query}&mode=artlist&format=json&maxrecords=50"
        method: GET
        path_map:
          data: "$.articles"
        cache_ttl_sec: 7200

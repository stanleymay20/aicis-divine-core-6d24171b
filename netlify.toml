[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Supabase browser configuration must be supplied through Netlify environment
  # variables at cutover. Never hardcode the Lovable source project here.
  VITE_ENABLE_GOOGLE_OAUTH = "false"

# React Router SPA fallback. Static assets are served before this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

name: Forecast Ledger Migration Exact Transfer

on:
  push:
    branches:
      - feat/forecast-ledger-migration-v1
    paths:
      - '.github/workflows/forecast-ledger-migration-generation-proof.yml'

permissions:
  contents: write

jobs:
  transfer:
    name: Commit exact CLI-proven migration and self-remove
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify exact proven bundle and transfer to CLI-generated path
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA='a7ed80a54d37b271dcd6b7a2d08f82009095785db5648f12e76d45eec79517aa'
          TARGET='supabase/migrations/20260902043532_forecast_task_registry_ledgers_v1.sql'

          cat \
            scripts/sql/forecast-task-registry-ledgers-v1.candidate.sql \
            scripts/sql/forecast-task-registry-ledgers-v1.hardening.sql \
            > /tmp/forecast-task-registry-ledgers-v1.sql

          ACTUAL_SHA="$(sha256sum /tmp/forecast-task-registry-ledgers-v1.sql | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test ! -e "$TARGET"

          cp /tmp/forecast-task-registry-ledgers-v1.sql "$TARGET"
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = "$EXPECTED_SHA"

          rm .github/workflows/forecast-ledger-migration-generation-proof.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET" .github/workflows/forecast-ledger-migration-generation-proof.yml
          git diff --cached --check
          git commit -m 'Add CLI-generated forecast ledger migration'
          git push origin HEAD:feat/forecast-ledger-migration-v1

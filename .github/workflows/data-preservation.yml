name: AICIS Data Preservation Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aicis-data-preservation
  cancel-in-progress: false

jobs:
  encrypted-production-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production-data-preservation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify required source secrets exist
        env:
          AICIS_DATABASE_URL: ${{ secrets.AICIS_SOURCE_DATABASE_URL }}
          AICIS_BACKUP_PASSPHRASE: ${{ secrets.AICIS_BACKUP_PASSPHRASE }}
          AICIS_SUPABASE_URL: ${{ secrets.AICIS_SOURCE_SUPABASE_URL }}
          AICIS_SERVICE_ROLE_KEY: ${{ secrets.AICIS_SOURCE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$AICIS_DATABASE_URL" || { echo "AICIS_SOURCE_DATABASE_URL is not configured"; exit 1; }
          test -n "$AICIS_BACKUP_PASSPHRASE" || { echo "AICIS_BACKUP_PASSPHRASE is not configured"; exit 1; }
          test -n "$AICIS_SUPABASE_URL" || { echo "AICIS_SOURCE_SUPABASE_URL is not configured"; exit 1; }
          test -n "$AICIS_SERVICE_ROLE_KEY" || { echo "AICIS_SOURCE_SERVICE_ROLE_KEY is not configured"; exit 1; }

      - name: Capture read-only source inventory
        env:
          AICIS_SOURCE_DATABASE_URL: ${{ secrets.AICIS_SOURCE_DATABASE_URL }}
        run: bash scripts/aicis-source-inventory.sh artifacts/aicis-source-inventory

      - name: Encrypt source inventory
        env:
          AICIS_BACKUP_PASSPHRASE: ${{ secrets.AICIS_BACKUP_PASSPHRASE }}
        run: |
          tar -C artifacts -czf artifacts/aicis-source-inventory.tar.gz aicis-source-inventory
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in artifacts/aicis-source-inventory.tar.gz \
            -out artifacts/aicis-source-inventory.tar.gz.enc \
            -pass env:AICIS_BACKUP_PASSPHRASE
          sha256sum artifacts/aicis-source-inventory.tar.gz.enc > artifacts/aicis-source-inventory.tar.gz.enc.sha256
          rm -rf artifacts/aicis-source-inventory artifacts/aicis-source-inventory.tar.gz

      - name: Create and validate encrypted source database snapshot
        env:
          AICIS_DATABASE_URL: ${{ secrets.AICIS_SOURCE_DATABASE_URL }}
          AICIS_BACKUP_PASSPHRASE: ${{ secrets.AICIS_BACKUP_PASSPHRASE }}
        run: bash scripts/aicis-backup.sh artifacts/aicis-backup

      - name: Mirror source Storage object bytes
        env:
          AICIS_SUPABASE_URL: ${{ secrets.AICIS_SOURCE_SUPABASE_URL }}
          AICIS_SERVICE_ROLE_KEY: ${{ secrets.AICIS_SOURCE_SERVICE_ROLE_KEY }}
        run: node scripts/aicis-storage-backup.mjs artifacts/aicis-storage

      - name: Encrypt Storage mirror
        env:
          AICIS_BACKUP_PASSPHRASE: ${{ secrets.AICIS_BACKUP_PASSPHRASE }}
        run: |
          tar -C artifacts -czf artifacts/aicis-storage.tar.gz aicis-storage
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in artifacts/aicis-storage.tar.gz \
            -out artifacts/aicis-storage.tar.gz.enc \
            -pass env:AICIS_BACKUP_PASSPHRASE
          sha256sum artifacts/aicis-storage.tar.gz.enc > artifacts/aicis-storage.tar.gz.enc.sha256
          rm -rf artifacts/aicis-storage artifacts/aicis-storage.tar.gz

      - name: Assert no plaintext production payload remains
        run: |
          if find artifacts -type f \( -name '*.dump' -o -name '*.sql' -o -name '*.tar.gz' -o -name '*.tsv' -o -name '*.txt' \) | grep -q .; then
            echo "Plaintext production data remains in the artifact directory" >&2
            exit 1
          fi

      - name: Upload encrypted snapshot
        uses: actions/upload-artifact@v4
        with:
          name: aicis-encrypted-production-backup-${{ github.run_id }}
          path: |
            artifacts/aicis-source-inventory.tar.gz.enc
            artifacts/aicis-source-inventory.tar.gz.enc.sha256
            artifacts/aicis-backup/*.enc
            artifacts/aicis-backup/*-manifest.txt
            artifacts/aicis-storage.tar.gz.enc
            artifacts/aicis-storage.tar.gz.enc.sha256
          if-no-files-found: error
          retention-days: 30

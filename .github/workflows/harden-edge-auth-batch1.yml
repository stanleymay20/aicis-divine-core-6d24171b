name: One-off Edge auth hardening batch 1

on:
  push:
    paths:
      - '.github/workflows/harden-edge-auth-batch1.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply audited batch-1 authorization transform
        run: python3 scripts/harden-edge-auth-batch1.py

      - name: Verify only the 10 scheduler-rebind functions remain
        shell: bash
        run: |
          set +e
          python3 scripts/audit-edge-function-auth.py | tee /tmp/auth-audit.txt
          set -e
          grep -q 'privileged_guarded=203' /tmp/auth-audit.txt
          grep -q 'privileged_unguarded=10' /tmp/auth-audit.txt
          grep -q 'autonomous-accumulator' /tmp/auth-audit.txt
          grep -q 'reliefweb-firehose' /tmp/auth-audit.txt

      - name: Typecheck
        run: bun run typecheck

      - name: Strict portability lint gate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="0f316cf331ef45cebd62937b4ad63c8e2bc4d984"
          {
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.ts' '*.tsx'
            git diff --name-only --diff-filter=ACMR -- '*.ts' '*.tsx'
          } | sort -u > /tmp/strict-files.txt
          mapfile -t FILES < /tmp/strict-files.txt
          node .github/scripts/strict-lint-portability-gate.mjs "$BASE_SHA" "${FILES[@]}"

      - name: Global lint debt ceiling
        shell: bash
        run: |
          set +e
          bunx eslint . -f json > /tmp/eslint-report.json
          ESLINT_STATUS=$?
          set -e
          if [ "$ESLINT_STATUS" -gt 1 ]; then
            exit "$ESLINT_STATUS"
          fi
          node .github/scripts/check-lint-baseline.mjs /tmp/eslint-report.json 1391 67

      - name: Production build
        run: bun run build

      - name: Commit validated hardening batch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions scripts/audit-edge-function-auth.py
          git diff --cached --stat
          git commit -m "harden privileged Edge Function caller boundaries"
          git push origin HEAD:main

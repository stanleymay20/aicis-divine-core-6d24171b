name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Zero Lovable runtime dependencies
        id: lovable_runtime
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/audit-lovable-runtime.sh

      - name: No executable source-project bindings
        id: source_bindings
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/audit-source-project-bindings.sh --strict

      - name: Target cron quarantine
        id: target_cron
        continue-on-error: true
        run: python3 scripts/audit-target-cron-quarantine.py

      - name: Privileged Edge Function auth
        id: edge_auth
        continue-on-error: true
        run: python3 scripts/audit-edge-function-auth.py

      - name: Exact deferred privileged-auth set
        id: deferred_auth
        continue-on-error: true
        run: python3 scripts/audit-deferred-privileged-auth.py

      - name: Secret-name inventory
        id: secret_inventory
        continue-on-error: true
        run: python3 scripts/aicis-secret-inventory.py

      - name: Migration view replacement safety
        id: migration_views
        continue-on-error: true
        run: python3 scripts/audit-migration-view-replacements.py

      - name: Strict lint — post-portability code
        id: strict_lint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # AICIS completed the provider-portability rewrite at this checkpoint.
          # Ordinary changed TypeScript must remain lint-clean. Legacy files changed
          # solely to add the standardized privileged-auth boundary may retain only
          # rule-count debt that demonstrably existed at this same baseline.
          BASE_SHA="0f316cf331ef45cebd62937b4ad63c8e2bc4d984"
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.ts' '*.tsx')
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No TypeScript files changed since portability baseline."
            exit 0
          fi
          printf 'Strict-linting %s file(s):\n' "${#FILES[@]}"
          printf ' - %s\n' "${FILES[@]}"
          node .github/scripts/strict-lint-portability-gate.mjs "$BASE_SHA" "${FILES[@]}"

      - name: Legacy lint debt ratchet
        id: lint_ratchet
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          set +e
          bunx eslint . -f json > eslint-report.json
          ESLINT_STATUS=$?
          set -e
          if [ "$ESLINT_STATUS" -gt 1 ]; then
            echo "ESLint execution/configuration failed with status $ESLINT_STATUS"
            exit "$ESLINT_STATUS"
          fi
          # Tightened to the verified 2026-08-26 debt after privileged-auth hardening.
          # Future work may only reduce or hold these counts; never raise this ceiling
          # to make a change pass.
          node .github/scripts/check-lint-baseline.mjs eslint-report.json 1227 66

      - name: Typecheck
        id: typecheck
        if: always()
        continue-on-error: true
        run: bun run typecheck

      - name: Production build
        id: build
        if: always()
        continue-on-error: true
        run: bun run build

      - name: Verification summary
        if: always()
        shell: bash
        run: |
          echo "Lovable runtime gate: ${{ steps.lovable_runtime.outcome }}"
          echo "Source-project binding gate: ${{ steps.source_bindings.outcome }}"
          echo "Target cron quarantine: ${{ steps.target_cron.outcome }}"
          echo "Privileged Edge Function auth: ${{ steps.edge_auth.outcome }}"
          echo "Deferred privileged-auth manifest: ${{ steps.deferred_auth.outcome }}"
          echo "Secret-name inventory: ${{ steps.secret_inventory.outcome }}"
          echo "Migration view replacement safety: ${{ steps.migration_views.outcome }}"
          echo "Strict lint: ${{ steps.strict_lint.outcome }}"
          echo "Lint debt ratchet: ${{ steps.lint_ratchet.outcome }}"
          echo "Typecheck: ${{ steps.typecheck.outcome }}"
          echo "Build: ${{ steps.build.outcome }}"

          FAILED=0
          [ "${{ steps.lovable_runtime.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.source_bindings.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.target_cron.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.edge_auth.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.deferred_auth.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.secret_inventory.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.migration_views.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.strict_lint.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.lint_ratchet.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.typecheck.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.build.outcome }}" = "success" ] || FAILED=1

          if [ "${{ steps.edge_auth.outcome }}" != "success" ] && [ "${{ steps.deferred_auth.outcome }}" = "success" ]; then
            echo "Known pre-cutover blocker: the exact deferred privileged-auth manifest still contains unguarded functions."
            echo "CI intentionally remains red until those caller paths are proven and the unguarded count reaches zero."
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more verification gates failed."
            exit 1
          fi

          echo "All verification gates passed."

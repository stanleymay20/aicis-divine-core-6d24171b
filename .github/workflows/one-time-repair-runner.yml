name: One-time repair runner

on:
  push:
    branches: [main]
    paths:
      - scripts/one-time-strict-lint-repair.py
      - scripts/one-time-strict-lint-repair-v2.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply corrected repair script
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/text.count("sb: any") != 9/text.count("sb: any") != 10/' scripts/one-time-strict-lint-repair.py
          sed -i 's/expected 9 sb:any occurrences/expected 10 sb:any occurrences/' scripts/one-time-strict-lint-repair.py
          python3 scripts/one-time-strict-lint-repair.py
      - name: Verify repaired files
        run: |
          bunx eslint src/pages/Simulation.tsx supabase/functions/_shared/export-schema.ts supabase/functions/export-aicis-dataset/index.ts supabase/functions/public-api/index.ts --max-warnings=0
          bun run typecheck
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AICIS CI Repair"
          git config user.email "107648937+stanleymay20@users.noreply.github.com"
          git add src/pages/Simulation.tsx supabase/functions/_shared/export-schema.ts supabase/functions/export-aicis-dataset/index.ts supabase/functions/public-api/index.ts
          git diff --cached --check
          git commit -m "repair strict lint regressions"
          git push origin HEAD:main

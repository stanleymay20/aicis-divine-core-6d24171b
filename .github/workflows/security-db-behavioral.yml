name: Security DB Behavioral Proof

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-truth-floor:
    name: Security truth-floor behavioral DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aicis_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aicis_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: aicis_security_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Supabase-compatible test roles
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END
          $$;
          SQL

      - name: Execute security truth-floor migration
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260830220000_security_truth_floor_v1.sql

      - name: Execute behavioral security assertions
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 \
            -f supabase/tests/security_truth_floor_behavioral.sql

name: One-off GlobalMap hook fix

on:
  push:
    paths:
      - '.github/workflows/fix-global-map-hook.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact GlobalMap patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/command-center/GlobalMap.tsx')
          text = path.read_text()
          old = '          flyToLocation(data.longitude, data.latitude, 5);'
          new = '''          map.current?.flyTo({
            center: [data.longitude, data.latitude],
            zoom: 5,
            duration: 2000,
            essential: true,
          });'''
          matches = text.count(old)
          if matches != 1:
              raise SystemExit(f'expected exactly 1 target, found {matches}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/command-center/GlobalMap.tsx
          if git diff --cached --quiet; then
            echo "No patch required"
            exit 0
          fi
          git commit -m "fix GlobalMap hook dependency"
          git push origin HEAD:main

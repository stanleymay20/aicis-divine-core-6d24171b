name: Authentication Boundary Proof

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auth-boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-boundary:
    name: Authentication boundary regression proof
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Audit privileged Edge authorization
        run: python3 scripts/audit-edge-function-auth.py

      - name: Execute auth truth-floor assertions
        run: node --test tests/auth-boundary-truth-floor.test.mjs
